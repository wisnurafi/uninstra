name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Uninstra.sln

      - name: Build (treat warnings as errors)
        run: dotnet build Uninstra.sln -c Release --no-restore /warnaserror --nologo

      - name: Test
        run: dotnet test Uninstra.sln -c Release --no-build --nologo
